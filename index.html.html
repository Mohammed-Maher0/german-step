<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="منصة لتعلّم الألمانية للناطقين بالعربية: مستويات A1 وA2 بقواعد كاملة وتمارين واختبارات.">
<title>ألماني خطوة خطوة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: German signage meets a study notebook. One column on phones with a bottom tab bar,
   a centered 960px column with top tabs on desktop. The der / die / das colours are the only loud colour;
   everything else stays graphite and paper. */
:root {
  --bg: #F1F2EE;
  --surface: #FFFFFF;
  --surface-2: #E8EAE4;
  --ink: #15181C;
  --ink-2: #4A515A;
  --line: #D3D6CF;
  --accent: #F2B705;
  --accent-soft: #FBEBB0;
  --mark-bg: #FFE38A;
  --der: #1F5FD1;  --der-bg: #E2EBFB;
  --die: #C8342F;  --die-bg: #FAE3E1;
  --das: #1E8749;  --das-bg: #DAF0E3;
  --on-art: #FFFFFF;
  --shadow: 0 1px 0 rgba(21,24,28,.05), 0 14px 30px -18px rgba(21,24,28,.28);
  --f-ar: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --f-de: 'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --fs-xs: 12.5px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --surface: #181C21; --surface-2: #21262C; --ink: #EEF0F2; --ink-2: #A3AAB4; --line: #2B3138;
    --accent: #F5C02A; --accent-soft: #3A3210; --mark-bg: #5B4A0C;
    --der: #7BA7FF; --der-bg: #1B2A4A; --die: #FF8A85; --die-bg: #4A1F1E; --das: #66CB8D; --das-bg: #17382A;
    --on-art: #0C1117;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 14px 30px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #181C21; --surface-2: #21262C; --ink: #EEF0F2; --ink-2: #A3AAB4; --line: #2B3138;
  --accent: #F5C02A; --accent-soft: #3A3210; --mark-bg: #5B4A0C;
  --der: #7BA7FF; --der-bg: #1B2A4A; --die: #FF8A85; --die-bg: #4A1F1E; --das: #66CB8D; --das-bg: #17382A;
  --on-art: #0C1117;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 14px 30px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 var(--fs-md)/1.65 var(--f-ar);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
mark { background: var(--mark-bg); color: inherit; border-radius: 4px; padding: 0 .18em; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.de { font-family: var(--f-de); direction: ltr; unicode-bidi: isolate; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wk-bar { fill: var(--line); }
.wk-bar.met { fill: var(--ink); }
.wk-v { fill: var(--ink); font: 600 12px var(--f-de); }
.wk-d { fill: var(--ink-2); font: 500 12px var(--f-ar); }
.wk-d.today { fill: var(--ink); font-weight: 700; }
.wrap { max-width: 960px; margin-inline: auto; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.no-tts [data-act="say"] { display: none; }

/* ---------- header ---------- */
.hdr { display: flex; align-items: center; gap: 12px; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-inline-end: auto; }
.mark3 { display: grid; grid-template-columns: repeat(3, 7px); gap: 3px; direction: ltr; }
.mark3 i { display: block; width: 7px; height: 26px; border-radius: 3px; }
.mark3 i:nth-child(1) { background: var(--der); }
.mark3 i:nth-child(2) { background: var(--die); }
.mark3 i:nth-child(3) { background: var(--das); }
.brand small { display: block; font: 500 12px/1.2 var(--f-de); letter-spacing: .04em; color: var(--ink-2); direction: ltr; text-align: start; }
.chips { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip small { color: var(--ink-2); font-weight: 500; }
.chip .ic { fill: var(--accent); stroke: var(--ink); }
.hdr-nav { display: none; gap: 4px; }
.hdr-nav a, .tabs a { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; font-weight: 600; color: var(--ink-2); }
.hdr-nav a { padding: 8px 16px; }
.hdr-nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }

.tabbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-width: 520px; margin-inline: auto; }
.tabs a { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 12px; border-radius: var(--r-sm); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.tabs .ic { width: 22px; height: 22px; }

main { padding-block: 8px calc(100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
.grid2 > * { min-width: 0; }
main, .lesson-sec, .qpanel, .uhead, .run-head, .hero, .journey, .vrow, .fb { grid-template-columns: minmax(0, 1fr); }
main > *, .lesson-sec > *, .qpanel > *, .uhead > *, .fb > * { min-width: 0; }
.brand { white-space: nowrap; font-size: 16px; }

/* ---------- shared components ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; min-width: 0; }
.panel h2 { font-size: var(--fs-lg); margin-bottom: 4px; }
.panel .sub { color: var(--ink-2); font-size: var(--fs-sm); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 22px; border-radius: var(--r-md);
  border: 2px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; text-align: center;
}
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.sm { min-height: 40px; padding: 6px 14px; font-size: var(--fs-sm); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); }
.icon-btn:hover { border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select {
  min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); max-width: 100%;
}
.eyebrow { font-size: var(--fs-xs); letter-spacing: .06em; color: var(--ink-2); font-weight: 600; }

.art { display: inline-flex; align-items: center; font: 700 .8em/1.2 var(--f-de); direction: ltr; padding: .12em .5em; border-radius: 7px; letter-spacing: .02em; }
.art.der { background: var(--der-bg); color: var(--der); }
.art.die { background: var(--die-bg); color: var(--die); }
.art.das { background: var(--das-bg); color: var(--das); }
.art.solid.der { background: var(--der); color: var(--on-art); }
.art.solid.die { background: var(--die); color: var(--on-art); }
.art.solid.das { background: var(--das); color: var(--on-art); }
.tag { display: inline-block; font-size: var(--fs-xs); font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.wd { display: inline-flex; align-items: baseline; gap: .35em; direction: ltr; font-family: var(--f-de); font-weight: 700; }
.ex { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 4px; }
.ex .de-line { font: 500 19px/1.4 var(--f-de); direction: ltr; text-align: left; }
.ex .ar-line { color: var(--ink-2); font-size: var(--fs-sm); }
.ex-row { display: flex; align-items: flex-start; gap: 10px; }
.ex-row > div { flex: 1; min-width: 0; }

/* ---------- home ---------- */
.hero { display: grid; gap: 20px; padding: 22px 18px; box-shadow: var(--shadow); }
.hero-top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ring-wrap { position: relative; width: 132px; height: 132px; flex: none; }
.ring { width: 100%; height: 100%; display: block; }
.ring-in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-in b { font: 700 34px/1 var(--f-de); font-variant-numeric: tabular-nums; direction: ltr; }
.ring-in span { font-size: var(--fs-xs); color: var(--ink-2); }
.hero-text { flex: 1; min-width: 200px; display: grid; gap: 6px; }
.hero-text h1 { font-size: var(--fs-xl); }
.streak-n { font: 700 56px/1 var(--f-de); font-variant-numeric: tabular-nums; direction: ltr; display: inline-flex; align-items: center; gap: 8px; }
.streak-n .ic { width: 40px; height: 40px; fill: var(--accent); stroke: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; }
.stat b { display: block; font: 700 24px/1.2 var(--f-de); direction: ltr; text-align: start; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--fs-xs); color: var(--ink-2); }
.goal-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.modes { display: grid; gap: 12px; grid-template-columns: 1fr; }
.mode { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.mode:hover { border-color: var(--ink); }
.mode .m-ic { grid-row: span 2; width: 52px; height: 52px; border-radius: 14px; background: var(--surface-2); display: grid; place-content: center; }
.mode .m-ic .ic { width: 26px; height: 26px; }
.mode h3 { font-size: 18px; }
.mode p { color: var(--ink-2); font-size: var(--fs-sm); }
.mode .pill { grid-column: 2; justify-self: start; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); font-size: var(--fs-xs); font-weight: 600; }
.wod .wd { font-size: 44px; line-height: 1.1; }
.wod-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.wod .meaning { font-size: var(--fs-lg); font-weight: 600; margin-bottom: 12px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; margin-top: 14px; direction: ltr; position: relative; }
.week .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; min-width: 0; }
.week .bar { width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; background: var(--line); }
.week .bar.met { background: var(--ink); }
.week .val { font: 600 12px/1 var(--f-de); font-variant-numeric: tabular-nums; }
.week .day { font-size: 12px; color: var(--ink-2); }
.week .col.today .day { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.week-box { position: relative; }
.goal-line { position: absolute; inset-inline: 0; border-top: 2px dashed var(--ink-2); opacity: .55; pointer-events: none; }
.goal-tag { position: absolute; inset-inline-start: 0; font-size: 11px; color: var(--ink-2); background: var(--surface); padding: 0 4px; transform: translateY(-100%); }
.topics { display: grid; gap: 4px 16px; grid-template-columns: 1fr; margin-top: 8px; }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: start; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; }
.topic:hover b { text-decoration: underline; }
.topic .meter { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; direction: ltr; }
.topic .meter i { display: block; height: 100%; }
.topic .meter .k { background: var(--ink); }
.topic .meter .s { background: var(--ink-2); opacity: .45; }
.topic span.n { font-size: var(--fs-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- article trainer ---------- */
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dots { display: flex; gap: 5px; direction: ltr; }
.dots i { width: 22px; height: 8px; border-radius: 4px; background: var(--line); }
.dots i.ok { background: var(--ink); }
.dots i.bad { background: transparent; border: 2px dashed var(--ink-2); }
.dots i.cur { background: var(--accent); outline: 2px solid var(--ink); }
.qcard { text-align: center; padding: 26px 16px 22px; display: grid; gap: 6px; justify-items: center; }
.q-ar { color: var(--ink-2); font-size: var(--fs-lg); }
.q-de { display: flex; align-items: center; justify-content: center; gap: 12px; direction: ltr; flex-wrap: wrap; }
.q-de .w { font: 700 clamp(44px, 13vw, 68px)/1.05 var(--f-de); overflow-wrap: anywhere; }
.slot { display: inline-grid; place-content: center; min-width: 64px; height: 44px; padding-inline: 10px; border: 2px dashed var(--ink-2); border-radius: 10px; color: var(--ink-2); font: 600 22px/1 var(--f-de); }
.q-de .art { font-size: clamp(26px, 7vw, 36px); }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; direction: ltr; }
.ch { position: relative; min-height: 92px; border-radius: var(--r-md); border: 2px solid; font: 700 clamp(28px, 8vw, 38px)/1 var(--f-de); display: grid; place-content: center; gap: 6px; transition: transform .12s, opacity .2s; }
.ch .k { font: 500 11px/1 var(--f-ar); opacity: .75; }
.ch.der { background: var(--der-bg); color: var(--der); border-color: var(--der); }
.ch.die { background: var(--die-bg); color: var(--die); border-color: var(--die); }
.ch.das { background: var(--das-bg); color: var(--das); border-color: var(--das); }
.ch:not([disabled]):hover { transform: translateY(-2px); }
.ch.der.on { background: var(--der); color: var(--on-art); }
.ch.die.on { background: var(--die); color: var(--on-art); }
.ch.das.on { background: var(--das); color: var(--on-art); }
.ch.dim { opacity: .4; }
.ch.wrong { border-style: dashed; opacity: .75; }
.ch .badge { position: absolute; top: 6px; inset-inline-end: 6px; width: 22px; height: 22px; }
.ch[disabled] { cursor: default; }
.fb { display: grid; gap: 12px; animation: rise .25s ease-out; }
.fb-head { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: var(--fs-lg); }
.fb-head .ic { width: 28px; height: 28px; padding: 4px; border-radius: 50%; background: var(--accent); color: #15181C; stroke-width: 3; }
.fb-head.bad .ic { background: transparent; border: 2px dashed var(--ink-2); color: var(--ink); }
.fb-head small { margin-inline-start: auto; font: 600 14px var(--f-de); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; }
.fb-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: var(--fs-md); }
.rule-box { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 4px; }
.rule-box b { font-size: var(--fs-sm); }
.rule-box p { font-size: var(--fs-sm); color: var(--ink-2); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.sum { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 28px 16px; }
.sum .score { font: 700 84px/1 var(--f-de); direction: ltr; font-variant-numeric: tabular-nums; }
.sum .score small { font-size: 36px; color: var(--ink-2); }
.wrong-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.wrong-list .tag { display: inline-flex; gap: 6px; align-items: center; padding: 4px 12px; background: var(--surface-2); color: var(--ink); font-size: var(--fs-sm); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.filter-pill { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- flashcards ---------- */
.fcard { padding: 24px 18px; display: grid; gap: 18px; min-height: 320px; align-content: start; }
.fc-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fc-front { display: grid; gap: 10px; justify-items: center; text-align: center; }
.fc-front .wd { font-size: clamp(44px, 13vw, 64px); line-height: 1.05; flex-wrap: wrap; justify-content: center; overflow-wrap: anywhere; }
.fc-front .wd.phrase { font-size: clamp(32px, 9vw, 44px); }
.fc-front .wd .art { font-size: .55em; }
.fc-front .ar-big { font-size: clamp(32px, 9vw, 44px); font-weight: 700; line-height: 1.3; }
.fc-prompt { color: var(--ink-2); font-size: var(--fs-sm); }
.fc-back { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 14px; animation: rise .25s ease-out; }
.fc-back .meaning { font-size: 26px; font-weight: 700; text-align: center; }
.fc-back .forms { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; font-size: var(--fs-md); align-items: center; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rate button { min-height: 64px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--surface); display: grid; place-content: center; gap: 2px; font-weight: 700; padding: 6px; }
.rate button small { font-weight: 500; color: var(--ink-2); font-size: var(--fs-xs); }
.rate button:hover { border-color: var(--ink); }
.rate .good { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rate .good small { color: inherit; opacity: .8; }
.fc-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* ---------- rules ---------- */
.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); }
.rgroup { display: grid; gap: 12px; }
.rgroup > h2 { display: flex; align-items: center; gap: 12px; font-size: var(--fs-lg); }
.rgroup > h2 .art { font-size: 26px; }
.rules-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.rule-top { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.sfx { font: 700 26px/1.1 var(--f-de); direction: ltr; padding: 2px 10px; border-radius: 8px; }
.sfx.der { background: var(--der-bg); color: var(--der); }
.sfx.die { background: var(--die-bg); color: var(--die); }
.sfx.das { background: var(--das-bg); color: var(--das); }
.rule h3 { font-size: var(--fs-md); }
.rule p { color: var(--ink-2); font-size: var(--fs-sm); }
.rule .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

/* ---------- platform: lesson ---------- */
.flip { transform: scaleX(-1); }
.ia { font-weight: 700; }
.ia.der { color: var(--der); } .ia.die { color: var(--die); } .ia.das { color: var(--das); }
.stars { display: inline-flex; gap: 2px; direction: ltr; }
.stars .ic { width: 18px; height: 18px; stroke: var(--ink-2); fill: none; }
.stars .ic.on { fill: var(--accent); stroke: var(--ink); }
.btn.big { min-height: 56px; padding-inline: 28px; font-size: var(--fs-lg); }

function dueCount() { const t = dnum(); return WORDS.filter(w => S.cards[w.id] && S.cards[w.id].due <= t).length; }
function artAccuracy() {
  let ok = 0, bad = 0; Object.values(S.art).forEach(a => { ok += a.ok; bad += a.bad; });
  return ok + bad ? Math.round(100 * ok / (ok + bad)) : null;
}
function nextBox(c, r) {
  const b = c ? c.box : 0;
  if (r === 'again') return 1;
  if (r === 'good') return Math.min(5, b + 1);
  return Math.min(5, b + 2);
}
function rateCard(id, r) {
  const t = dnum(), c = S.cards[id] || { box: 0, due: t, n: 0 };
  c.box = nextBox(S.cards[id], r);
  c.due = r === 'again' ? t : t + INT[c.box];
  c.n = (c.n || 0) + 1;
  S.cards[id] = c;
}

    (p > 0 ? '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + (done ? 'var(--accent)' : 'var(--ink)') + '" stroke-width="12" stroke-linecap="round" ' +

}
function weekSVG() {

/* =====================================================

   ===================================================== */
let A = { topic: 'all', q: [], i: 0, ans: null, res: [], xp: 0, label: '' };
function artPool(topic) { return NOUNS.filter(w => topic === 'all' || w.t === topic); }
function startArt(words, label) {
  let q;
  if (words) q = shuffle(words).slice(0, 10);
  else {
    const sc = w => { const a = S.art[w.id] || { ok: 0, bad: 0 }; return a.ok - 2 * a.bad + Math.random() * 3; };
    q = shuffle(artPool(A.topic).slice().sort((x, y) => sc(x) - sc(y)).slice(0, 10));
  }
  A.q = q; A.i = 0; A.ans = null; A.res = []; A.xp = 0; A.label = label || '';
}
function answerArt(a) {
  const w = A.q[A.i]; if (A.ans || !w) return;
  A.ans = a; const ok = a === w.art, rec = S.art[w.id] = S.art[w.id] || { ok: 0, bad: 0 };
  if (ok) { rec.ok++; A.xp += 10; A.res[A.i] = true; addXP(10); } else { rec.bad++; A.res[A.i] = false; save(); }
  render();
}
function ruleBoxes(w) {
  let h = '';

    h += '<div class="rule-box"><b>القاعدة: ' + esc(r.h) + ' ← ' + r.art + (r.lv === 'm' ? ' (غالبًا)' : '') + '</b><p>' + esc(r.d) + '</p></div>';

}

let F = { topic: 'all', q: [], i: 0, shown: false, done: 0, xp: 0, init: false, requeued: {} };
function buildQueue() {
  const t = dnum(), pool = WORDS.filter(w => F.topic === 'all' || w.t === F.topic);
  const due = pool.filter(w => S.cards[w.id] && S.cards[w.id].due <= t).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).slice(0, 20);
  const started = id => !!(S.units[id] && (S.units[id].seen || S.units[id].done));
  const fresh = pool.filter(w => !S.cards[w.id]).sort((a, b) => (started(b.t) - started(a.t))).slice(0, 10);
  return { due, fresh, ids: due.concat(fresh).map(w => w.id) };
}
function startCards() { const b = buildQueue(); F.q = b.ids; F.i = 0; F.shown = false; F.done = 0; F.xp = 0; F.requeued = {}; F.init = true; F.nDue = b.due.length; F.nNew = b.fresh.length; }
function nextDueIn() {
  const t = dnum(), pool = WORDS.filter(w => F.topic === 'all' || w.t === F.topic);
  const ds = pool.filter(w => S.cards[w.id]).map(w => S.cards[w.id].due - t).filter(n => n > 0);
  return ds.length ? Math.min(...ds) : null;
}

              : '<span class="eyebrow">لا شيء للمراجعة الآن</span>') +
      '<p>' + (b.ids.length ? 'عندك بطاقات جاهزة أخرى.' : (n ? 'أحسنت، المراجعة القادمة ' + dayLabel(n) + '.' : 'لا توجد بطاقات في هذا الموضوع.')) + '</p>' +

  const front = '<div class="fc-front"><span class="de">' + (w.k === 'n' ? '<span class="wd">' + esc(w.de) + '</span>' : '<span class="wd' + (w.k === 'p' ? ' phrase' : '') + '">' + esc(w.de) + '</span>') + '</span>' +

  let back = '';

      : w.k === 'v' ? '<div class="forms"><span class="de wd" style="font-size:20px">' + esc(w.f) + '</span></div>' : '';
    const nextLbl = r => dayLabel(r === 'again' ? 0 : INT[nextBox(c, r)]);

/* =====================================================
   EVENTS
   ===================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'say') { say(el.dataset.text, el.dataset.rate); return; }
  if (act === 'ans') { answerArt(el.dataset.a); return; }
  if (act === 'art-next') { A.i++; A.ans = null; render(); return; }
  if (act === 'art-new') { startArt(); render(true); return; }
  if (act === 'art-wrong') { startArt(A.q.filter((w, i) => !A.res[i]), 'تدريب الأخطاء'); render(true); return; }
  if (act === 'rule-practice') { const k = el.dataset.k; A.topic = 'all'; startArt(WORDS.filter(w => w.r === k), RULES[k].s); location.hash = '#articles'; if (page === 'articles') render(true); return; }
  if (act === 'reveal') { F.shown = true; render(); return; }
  if (act === 'rate') {
    const id = F.q[F.i], r = el.dataset.r;
    rateCard(id, r);
    const gain = r === 'again' ? 1 : r === 'good' ? 8 : 10;
    F.xp += gain; F.done++;
    if (r === 'again' && (F.requeued[id] || 0) < 2) { F.requeued[id] = (F.requeued[id] || 0) + 1; F.q.push(id); }
    F.i++; F.shown = false; addXP(gain); render(); return;
  }
  if (act === 'fc-new') { startCards(); render(true); return; }
  if (act === 'topic') { F.topic = el.dataset.t; startCards(); location.hash = '#cards'; if (page === 'cards') render(true); return; }
  if (act === 'export') {
    try {
      const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'schritt-progress-' + dkey() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('تم حفظ ملف التقدم');
    } catch (err) { toast('تعذّر حفظ الملف'); }
    return;

    if (E.done) { if (oi === x.a) { c += ' ok'; mk = ico('check', 'mk'); } else if (oi === E.sel) { c += ' bad'; mk = ico('x', 'mk'); } else c += ' dim'; }
    return '<button class="' + c + '" data-act="opt" data-i="' + oi + '"' + (E.done ? ' disabled' : '') + '><span class="k">' + (n + 1) + '</span><span class="ot">' + rich(x.opts[oi]) + '</span>' + mk + '</button>';
  }).join('') + '</div>';
}
function keypadHTML() { return '<div class="keypad" aria-label="حروف ألمانية">' + ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'].map(c => '<button type="button" data-act="ins" data-c="' + c + '" class="de">' + c + '</button>').join('') + '</div>'; }
function bodyHTML(x, E, it) {
  const ctx = ctxHTML(x, it);
  switch (x.t) {
    case 'mc': return ctx + '<div class="qline">' + qHTML(x.q) + '</div>' + optsHTML(x, E);
    case 'lmc': return ctx + '<div class="listen">' + '<button class="btn big" data-act="say" data-text="' + esc(x.de) + '">' + ico('speaker') + 'استمع</button><button class="btn ghost sm" data-act="say" data-text="' + esc(x.de) + '" data-rate="0.6">أبطأ</button></div><div class="qline">' + qHTML(x.q) + '</div>' + optsHTML(x, E);
    case 'fill': {
      const parts = x.q.split('___'), dir = AR_RE.test(x.q) ? 'rtl' : 'ltr';
      const line = parts.map((p, k) => rich(p) + (k < parts.length - 1 ? '<input class="gap' + (E.done ? (E.gapOk[k] ? ' ok' : ' bad') : '') + '" data-gap="' + k + '" dir="ltr" autocomplete="off" autocapitalize="none" spellcheck="false" value="' + esc(E.vals[k] || '') + '" style="width:' + Math.max(6, [].concat(x.a[k])[0].length + 3) + 'ch"' + (E.done ? ' disabled' : '') + (k === 0 ? ' data-focus' : '') + ' aria-label="الفراغ ' + (k + 1) + '">' : '')).join('');
      return ctx + '<div class="fillq" dir="' + dir + '">' + line + '</div>' + (x.hint ? '<p class="muted hint">تلميح: <span class="de">' + esc(x.hint) + '</span></p>' : '') + (E.done ? '' : keypadHTML());
    }

    }
    case 'tr':
      return ctx + '<p class="prompt-ar">' + rich(x.ar) + '</p><input class="line-in' + (E.done ? (E.ok ? ' ok' : ' bad') : '') + '" id="tr-in" dir="ltr" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="اكتب بالألمانية" value="' + esc(E.val || '') + '"' + (E.done ? ' disabled' : ' data-focus') + '>' + (E.done ? '' : keypadHTML());

  }

}
function canCheck(x, E) { return x.t === 'order' ? E.picked.length > 0 : x.t === 'fill' ? E.vals.some(Boolean) : (x.t === 'tr' || x.t === 'dict') ? !!(E.val || '').trim() : false; }
function fbHTML(x, E, it) {
  const ok = E.ok, last = R.i === R.items.length - 1, sp = speakable(x);
  let ans = '';
  if (!ok) {
    if (x.t === 'match') ans = '<div class="fb-ans">' + x.pairs.map(p => '<div class="exrow"><span class="de">' + esc(p[0]) + '</span><span>=</span><span>' + rich(p[1]) + '</span></div>').join('') + '</div>';
    else ans = '<div class="fb-ans"><span class="muted">الإجابة الصحيحة</span><div class="ansline">' + rich(answerText(x)) + (sp ? spk(sp) : '') + '</div></div>';
  } else if (sp) ans = '<div class="fb-ans"><div class="ansline">' + rich(sp) + spk(sp) + '</div></div>';
  if (ok && x.t === 'tr' && x.a.length > 1) ans += '<p class="muted" style="font-size:var(--fs-sm)">طرق أخرى صحيحة: ' + x.a.filter(a => !nrmEq(a, E.val)).slice(0, 3).map(a => '<span class="de">' + esc(a) + '</span>').join('، ') + '</p>';
  return '<section class="panel fb"><div class="fb-head' + (ok ? '' : ' bad') + '">' + ico(ok ? 'check' : 'x') + '<span>' + (ok ? 'صحيح' : 'ليست صحيحة') + '</span>' + (it.retry ? '<small>محاولة ثانية</small>' : '') + '</div>' + ans +
    (x.why ? '<div class="rule-box"><b>لماذا؟</b><p>' + rich(x.why) + '</p></div>' : '') +
    '<button class="btn" data-act="run-next" data-focus>' + (last ? 'عرض النتيجة' : 'التالي') + ico('next') + '</button></section>';
}
function viewRun() {
  if (!R) { setTimeout(() => { location.hash = '#home'; }, 0); return ''; }
  if (R.i >= R.items.length) return runSummary();
  const it = R.items[R.i]; it.p = it.p || prep(it.x); const x = it.p, E = R.E;
  const pct = 100 * R.i / R.items.length;
  const checkBtn = (!E.done && x.t !== 'mc' && x.t !== 'lmc' && x.t !== 'match') ? '<button class="btn" data-act="check"' + (canCheck(x, E) ? '' : ' disabled') + '>تحقق</button>' : '';

}
function finishRun() {
  R.final = true;

  if (R.src === 'unit') {
    const st = S.units[R.unitId] = S.units[R.unitId] || {}, first = !st.done;
    if (R.pct >= 60) st.done = true;

function runSummary() {
  if (!R.final) finishRun();

  const pass = R.src === 'test' ? R.pct >= 70 : R.pct >= 60;
  const nx = R.src === 'unit' ? (() => { const i = ORDER.indexOf(R.unitId); return ORDER.slice(i + 1).find(id => UBY[id]); })() : null;
  const msg = R.src === 'test' ? (pass ? 'اجتزت امتحان المستوى. مبروك.' : 'لم تصل إلى 70٪ بعد. راجع الوحدات التي أخطأت فيها وأعد المحاولة.')
    : (R.pct >= 90 ? 'نتيجة ممتازة، أتقنت الوحدة.' : pass ? 'اجتزت الوحدة. راجع أخطاءك لتثبيتها.' : 'تحتاج 60٪ للاجتياز. راجع الدرس وأعد المحاولة.');

    '<p>' + msg + '</p><p class="muted">ربحت ' + R.xp + ' نقطة' + (R.bonus ? ' + ' + R.bonus + ' مكافأة إنهاء الوحدة' : '') + '</p>' +

    '<div class="btn-row">' + (R.src === 'unit' ? (pass && nx ? '<a class="btn" href="#unit-' + nx + '" data-focus>الوحدة التالية</a>' : '') + '<button class="btn ghost" data-act="start-unit" data-u="' + R.unitId + '">أعد التمارين</button><a class="btn ghost" href="#unit-' + R.unitId + '">راجع الدرس</a>'

/* =====================================================
   PRACTICE HUB
   ===================================================== */
function viewPractice() {
  const due = dueCount(), wr = wrongItems().length;
  const tile = (href, icn, h, p, act, extra) => (act ? '<button class="mode" ' + act + '>' : '<a class="mode" href="' + href + '">') + '<span class="m-ic">' + ico(icn) + '</span><h3>' + h + '</h3><p>' + p + '</p>' + (extra || '') + (act ? '</button>' : '</a>');
  const tst = L => { const t = S.tests[L] || {}; return tile('', 'check', 'امتحان <span class="de">' + L + '</span>', '30 سؤالًا من كل وحدات المستوى' + (t.best != null ? ' · أفضل نتيجة ' + t.best + '٪' : ''), 'data-act="start-test" data-l="' + L + '"' + (levelProgress(L).loaded < 3 ? ' disabled' : '')); };
  return '<section class="panel"><h1 style="font-size:var(--fs-xl)">تدرّب</h1><p class="sub">كرّر ما تعلمته بطرق مختلفة. التكرار المنتظم هو سر الحفظ.</p></section>' +
    '<section class="modes">' +
    tile('#cards', 'cards', 'بطاقات الكلمات', 'التكرار المتباعد لكل مفردات المنهج' + (due ? ' · ' + due + ' بطاقة للمراجعة' : '')) +

    tst('A1') + tst('A2') + '</section>';

/* =====================================================
   GRAMMAR REFERENCE
   ===================================================== */
let REFQ = '';
function refList(q) {
  q = q.trim().toLowerCase(); let n = 0, h = '';
  UNITS.forEach(u => {
    const secs = u.sections.filter(s => !q || JSON.stringify(s).toLowerCase().includes(q) || u.title.includes(q) || u.de.toLowerCase().includes(q));
    if (!secs.length) return; n += secs.length;

function viewRef() {

VIEWS.learn = viewLearn; VIEWS.unit = viewUnit; VIEWS.run = viewRun; VIEWS.practice = viewPractice; VIEWS.ref = viewRef;
VIEWS.test = () => { startTest(String(pageArg || 'a1').toUpperCase()); return ''; };

/* =====================================================
   EVENTS
   ===================================================== */
function afterRender() {
  if (page === 'run' && R && R.i < R.items.length && !R.E.done) {
    const x = R.items[R.i].p; if (x.t === 'lmc' && !R.E.played) { R.E.played = true; say(x.de); }
  }
}
const _render = render;
render = function (top) { _render(top); afterRender(); };

document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input.gap, input.line-in')) lastInput = e.target; });
document.addEventListener('input', e => {
  const t = e.target;
  if (page === 'run' && R && R.E && !R.E.done) {
    if (t.matches('input.gap')) { R.E.vals[+t.dataset.gap] = t.value; const b = $('[data-act="check"]'); if (b) b.disabled = !canCheck(R.items[R.i].p, R.E); }
    else if (t.id === 'tr-in') { R.E.val = t.value; const b = $('[data-act="check"]'); if (b) b.disabled = !canCheck(R.items[R.i].p, R.E); }
  }
  if (t.id === 'ref-q') { REFQ = t.value; $('#ref-list').innerHTML = refList(REFQ); }
});
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('.keypad')) e.preventDefault(); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;

  if (a === 'utab') { UT = el.dataset.v; render(); window.scrollTo(0, 0); return; }
  if (a === 'dlg-tr') { DLG_TR = !DLG_TR; render(); return; }

  if (a === 'vocab-cards') { F.topic = el.dataset.u; startCards(); location.hash = '#cards'; return; }
  if (a === 'start-unit') { startUnitRun(el.dataset.u); return; }

    const inp = (document.activeElement && document.activeElement.matches && document.activeElement.matches('input.gap, input.line-in')) ? document.activeElement : lastInput;
    if (!inp || !inp.isConnected) return;
    const s = inp.selectionStart == null ? inp.value.length : inp.selectionStart, e2 = inp.selectionEnd == null ? s : inp.selectionEnd;

function resolveMatch() {

document.addEventListener('keydown', e => {

route();
